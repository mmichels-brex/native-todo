# Standalone, pure-native build of the app in ../native/TodoApp.
# Regenerate the Xcode project after editing this file:  xcodegen generate
name: TodoStandalone
options:
  bundleIdPrefix: com.mmichels
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Todos (Native)"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targets:
  TodoStandalone:
    type: application
    platform: iOS
    sources:
      - path: TodoStandalone
      # Shared, framework-free app code. NativeAppHost.swift (the Expo bridge)
      # lives one level up and is intentionally not included.
      - path: ../native/TodoApp
        group: TodoApp
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmichels.nativetodo.standalone
schemes:
  TodoStandalone:
    build:
      targets:
        TodoStandalone: all
    run:
      config: Debug
